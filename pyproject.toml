[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "federal-civil-litigation-planner"
version = "1.1.0"
description = "Federal civil litigation duration analytics and synthetic planning scenarios."
requires-python = ">=3.12,<3.13"
dependencies = [
  "dbt-bigquery>=1.9.2,<1.10",
  "dbt-core>=1.9.2,<1.10",
  "fastapi>=0.116,<1",
  "google-cloud-bigquery>=3.35,<4",
  "google-cloud-storage>=3,<3.2",
  "numpy>=2.3,<3",
  "polars>=1.32,<2",
  "scipy>=1.16,<2",
  "uvicorn>=0.35,<1",
  "xgboost>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/litigation_planner"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9.2,<1.10",
]
