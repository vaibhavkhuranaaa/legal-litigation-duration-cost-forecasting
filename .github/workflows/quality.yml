name: quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python -m compileall -q src scripts tests
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python scripts/check_secrets.py
      - run: uv run --frozen python scripts/check_public_boundary.py
      - run: uv tool run pip-audit -r runtime-requirements.txt
      - run: cp analytics/profiles.yml.example analytics/profiles.yml
      - run: uv run --frozen dbt --no-version-check parse --project-dir analytics --profiles-dir analytics --target local --no-partial-parse
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
          DBT_LOCAL_DATABASE: /tmp/federal-civil-litigation-ci.duckdb
      - name: Verify dbt catches contract violations
        run: |
          if uv run --frozen dbt --no-version-check build --project-dir analytics --profiles-dir analytics --target local --select contract_failure_fixture --vars '{enable_contract_failure_fixture: true}'; then
            echo "Expected contract violation was accepted"
            exit 1
          fi
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
          DBT_LOCAL_DATABASE: /tmp/federal-civil-litigation-ci.duckdb
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: docker build -t federal-civil-planner:ci .
      - run: >-
          docker run --rm --network none federal-civil-planner:ci
          python -c "from litigation_planner.api import readiness; assert readiness().duration_forecast == 'unavailable'"
