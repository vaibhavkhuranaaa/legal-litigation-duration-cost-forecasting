numerator = "supported_nature_rows"
denominator = ""
cube_fields = ["supported_nature_records"]
cube_numerator_field = "supported_nature_records"
cube_denominator_field = ""

[[binding]]
context = "portfolio"
measure = "average_observed_duration_days"
numerator = "observed_duration_days"
denominator = "terminated_rows"
cube_fields = ["average_observed_duration_days"]
cube_numerator_field = ""
cube_denominator_field = "observed_terminations"

[[binding]]
context = "portfolio"
measure = "pending_share"
numerator = "pending_rows"
denominator = "rows"
cube_fields = ["pending_share"]
cube_numerator_field = "pending_records"
cube_denominator_field = "total_records"

[[binding]]
context = "portfolio"
measure = "match_coverage"
numerator = "matched_rows"
denominator = "rows"
cube_fields = ["match_coverage"]
cube_numerator_field = "matched_records"
cube_denominator_field = "total_records"

[[binding]]
context = "filing"
measure = "statistical_records"
numerator = "rows"
denominator = ""
cube_fields = ["cohort_records"]
cube_numerator_field = "cohort_records"
cube_denominator_field = ""

[[binding]]
context = "filing"
measure = "terminated_records"
numerator = "terminated_rows"
denominator = ""
cube_fields = ["observed_terminations"]
cube_numerator_field = "observed_terminations"
cube_denominator_field = ""

[[binding]]
context = "filing"
measure = "pending_records"
numerator = "pending_rows"
denominator = ""
cube_fields = ["pending_records"]
cube_numerator_field = "pending_records"
cube_denominator_field = ""

[[binding]]
context = "filing"
measure = "matched_records"
numerator = "matched_rows"
denominator = ""
cube_fields = ["matched_records"]
cube_numerator_field = "matched_records"
cube_denominator_field = ""

[[binding]]
