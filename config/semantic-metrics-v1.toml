measure = "followup_days"
numerator = "duration_days"
denominator = ""
cube_fields = ["followup_days"]
cube_numerator_field = "followup_days"
cube_denominator_field = ""

[[binding]]
context = "pending_age"
measure = "pending_records"
numerator = "rows"
denominator = ""
cube_fields = ["pending_records"]
cube_numerator_field = "pending_records"
cube_denominator_field = ""

[[binding]]
context = "pending_age"
measure = "matched_records"
numerator = "matched_rows"
denominator = ""
cube_fields = ["matched_pending_records"]
cube_numerator_field = "matched_pending_records"
