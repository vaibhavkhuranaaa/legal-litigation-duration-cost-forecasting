version = 1
contract_id = "public-row-mart.v1"
dataset_version = "fjc-civil-2026-03-31.v1"
schema_version = "1.0.0"
grain = "one governed FJC statistical record; not a guaranteed unique case"
source_snapshot_cutoff = "2026-03-31"
expected_statistical_records = 5008334
expected_collision_records = 362615
expected_pending_records = 457327

[dates]
public_precision = "month"
month_encoding = "first calendar day of month"
snapshot_precision = "day"
duration_definition = "nonnegative calendar days from filing to statistical termination or source cutoff"

[opaque_key]
algorithm = "HMAC-SHA-256"
version = 1
minimum_secret_bytes = 32
digest_bytes = 16
encoding = "base64url without padding"
scope = "dataset_version"
input = "private source_record_identifier"
public_stability = "stable only within one immutable dataset version"

[exports]
default_query_rows = 200
maximum_query_rows = 10000
maximum_csv_rows = 50000
csv_formula_safe = true
filtered_parquet_requires_explicit_action = true
full_download_requires_explicit_action = true
ordinary_queries_may_fetch_all_partitions = false

[manifest]
version = 1
required_fields = ["manifest_version", "contract_id", "dataset_version", "schema_version", "source_snapshot_cutoff", "source_attribution", "source_terms_url", "courtlistener_attribution", "courtlistener_terms_url", "dataset_terms", "null_policy", "date_policy", "opaque_key_version", "metric_registry_version", "minimum_app_version", "total_records", "partitions"]
partition_required_fields = ["path", "filing_year", "row_count", "byte_size", "sha256", "dataset_version", "schema_version"]
integrity_algorithm = "sha256"
partition_path_pattern = "^filing_year=20(1[0-9]|2[0-6])/[A-Za-z0-9._-]+[.]parquet$"
null_policy = "terminated_month is null exactly when pending_status is true; all other public fields are required except nature_of_suit_code, which is null exactly when mapping status is unsupported"
date_policy = "filed_month and terminated_month use first-day month encoding; source_snapshot_cutoff retains day precision"

[attribution]
source_name = "Federal Judicial Center Integrated Database (IDB), civil cases"
source_url = "https://www.fjc.gov/research/idb"
terms_url = "https://www.fjc.gov/research/idb"
required_notice = "Derived from Federal Judicial Center Integrated Database statistical records. The Federal Judicial Center and Administrative Office of the U.S. Courts do not endorse this analysis. Records describe statistical filings and terminations, not legal advice or predicted outcomes."

[courtlistener_terms]
source_name = "CourtListener RECAP bulk docket metadata, Free Law Project"
terms_url = "https://wiki.free.law/c/terms/courtlistener/courtlistenercom-terms-of-service-and-policies"
derived_field = "recap_match_available"
required_notice = "RECAP availability is derived from CourtListener data supplied by Free Law Project. Free Law Project did not produce, endorse, or verify this analysis. Do not use this field for a consumer-reporting purpose."

[download_terms]
status = "approval_gated"
notice = "Use for descriptive research and legal operations only. Verify against primary sources. No legal advice, outcome prediction, consumer report, or endorsement is provided. Preserve source attribution and this notice with every complete or filtered data download."
publication_gate = "M22 must reverify current official source terms and record fresh owner approval before enabling any public row-data download."

[[field]]
source_name = "source_record_identifier"
public_name = "release_record_key"
type = "string"
null_rule = "required"
purpose = "release-scoped row reference"
linkability = "private identifier replaced by keyed opaque value"
status = "allow_transformed"

[[field]]
source_name = "circuit_code"
public_name = "circuit_code"
type = "string"
null_rule = "required"
purpose = "circuit grouping"
linkability = "coarse geography"
status = "allow"

[[field]]
source_name = "district_code"
public_name = "district_code"
type = "string"
null_rule = "required"
purpose = "district grouping"
linkability = "necessary geography; office detail removed"
status = "allow"

[[field]]
source_name = "office_code"
public_name = ""
type = "string"
null_rule = "not published"
purpose = "candidate office grouping"
linkability = "unnecessary subdistrict quasi-identifier"
status = "deny"

[[field]]
source_name = "filed_date"
public_name = "filed_month"
type = "date"
null_rule = "required"
purpose = "monthly filing trends and annual partition selection"
linkability = "exact day removed; encoded as first day of month"
status = "allow_transformed"

[[field]]
source_name = "terminated_date"
public_name = "terminated_month"
type = "date or null"
null_rule = "null exactly when pending_status is true"
purpose = "monthly statistical termination trends"
linkability = "exact day removed; observed values encoded as first day of month"
status = "allow_transformed"

[[field]]
source_name = "censoring_date"
public_name = ""
type = "date"
null_rule = "not published"
purpose = "private duration derivation"
linkability = "redundant with public source snapshot cutoff"
status = "deny"

[[field]]
source_name = "pending_status"
public_name = "pending_status"
type = "boolean"
null_rule = "required; logical inverse of event_observed"
purpose = "pending inventory analysis"
linkability = "status attribute"
status = "allow"

[[field]]
source_name = "event_observed"
public_name = "event_observed"
type = "boolean"
null_rule = "required; logical inverse of pending_status"
purpose = "censoring semantics"
linkability = "statistical termination flag, not legal outcome"
status = "allow"

[[field]]
source_name = "duration_days"
public_name = "duration_days"
type = "integer"
null_rule = "required and nonnegative"
purpose = "descriptive elapsed-time analysis"
linkability = "exact derived interval retained for analytical utility; exact event days and office removed"
status = "allow"

[[field]]
source_name = "nature_of_suit_code"
public_name = "nature_of_suit_code"
type = "string or null"
null_rule = "null exactly when mapping status is unsupported"
purpose = "governed case-type analysis"
linkability = "public administrative category"
status = "allow"

[[field]]
source_name = "nature_of_suit_family"
public_name = "nature_of_suit_family"
type = "string"
null_rule = "required"
purpose = "coarse case-mix analysis"
linkability = "coarse administrative category"
status = "allow"

[[field]]
source_name = "nature_of_suit_mapping_status"
public_name = "nature_of_suit_mapping_status"
type = "string"
null_rule = "required; supported or unsupported"
purpose = "mapping quality disclosure"
linkability = "quality label"
status = "allow"

[[field]]
source_name = "jurisdiction_code"
public_name = "jurisdiction_code"
type = "string"
null_rule = "required"
purpose = "jurisdiction mix analysis"
linkability = "public administrative category"
status = "allow"

[[field]]
source_name = "origin_code"
public_name = "origin_code"
type = "string"
null_rule = "required"
purpose = "origin mix analysis"
linkability = "public administrative category"
status = "allow"

[[field]]
source_name = "procedural_cohort"
public_name = "procedural_cohort"
type = "string"
null_rule = "required"
purpose = "governed descriptive cohort analysis"
linkability = "derived administrative grouping, not legal classification"
status = "allow"

[[field]]
source_name = "identity_quality_status"
public_name = "identity_quality_status"
type = "string"
null_rule = "required; canonical or collision"
purpose = "prevent collision records from being presented as unique cases"
linkability = "quality label without source identifier"
status = "allow"

[[field]]
source_name = "source_record_count"
public_name = "source_record_count"
type = "integer"
null_rule = "required; one for canonical and at least two for collision"
purpose = "collision-group size disclosure"
linkability = "count only; private natural key removed"
status = "allow"

[[field]]
source_name = "recap_match_available"
public_name = "recap_match_available"
type = "boolean"
null_rule = "required"
purpose = "reviewed enrichment availability"
linkability = "availability only; RECAP identifiers and evidence removed"
status = "allow"

[[field]]
source_name = "source_snapshot_cutoff"
public_name = "source_snapshot_cutoff"
type = "date"
null_rule = "required and constant within dataset version"
purpose = "censoring and provenance"
linkability = "dataset-level date"
status = "allow"

[[field]]
source_name = "dataset_version"
public_name = "dataset_version"
type = "string"
null_rule = "required and constant within dataset version"
purpose = "immutable release provenance"
linkability = "release metadata"
status = "allow"

[prohibited]
exact_fields = ["source_record_identifier", "natural_case_identifier", "case_identifier", "source_row_number", "office_code", "filed_date", "terminated_date", "censoring_date", "docket_number", "pacer_case_id", "recap_docket_id", "case_name", "party_name", "judge_name", "attorney_name", "document_text", "docket_entry_text", "review_label", "match_evidence", "source_digest", "private_path", "credential", "model_artifact"]
name_fragments = ["docket", "pacer", "recap_id", "party", "judge", "attorney", "document", "description", "free_text", "reviewer", "credential", "password", "secret", "token", "private_path", "model_artifact"]
value_patterns = ["(?i)(api[_-]?key|password|access[_-]?token|client[_-]?secret)\\s*[:=]", "(?i)(/Users/|/home/|[A-Z]:\\\\Users\\\\)"]
